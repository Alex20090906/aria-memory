[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-memory"
version = "0.1.0"
description = "A hippocampal-style memory index plus an append-only record log for an always-on voice assistant (research code)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pypinyin>=0.50"]

[project.optional-dependencies]
vocab = ["tokenizers>=0.15"]   # only to load or build a model vocabulary (Vocab)
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
